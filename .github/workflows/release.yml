name: Release

# A fixed version tag builds the tarball and opens a draft release with it
# attached. Publishing the draft is a maintainer's step: an immutable release
# locks its assets when it is published, so the asset must be there first.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  draft:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # renovate: datasource=github-releases depName=oven-sh/bun extractVersion=^bun-v(?<version>.+)$
          bun-version: 1.4.4
          # A release builds what it publishes from the lockfile alone, so no
          # cache another run wrote can feed into it.
          no-cache: true
      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: test "v$(bun -e 'console.log(require("./package.json").version)')" = "$TAG"
      - run: bun install --frozen-lockfile
      - run: bun pm pack --destination "$RUNNER_TEMP"
      - name: Open the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" "$RUNNER_TEMP"/curlewlabs-com-workers-logs-reader-*.tgz \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "$TAG" \
            --notes-file - <<NOTES
          Install:

              bun add https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/curlewlabs-com-workers-logs-reader-${TAG#v}.tgz

          See README.md for what the package reads and how to use it.
          NOTES
